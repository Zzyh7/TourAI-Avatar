<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI导览 — 灵山胜境</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0D10;width:100vw;height:100vh;overflow:hidden}
body::after{content:"加载中...";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.4);font-family:sans-serif;font-size:14px;z-index:0}
iframe{position:relative;z-index:1;width:100%;height:100%;border:none}
</style></head><body>
<iframe id="dhIframe" src="http://localhost:3000/sentio" allow="camera;microphone;autoplay"></iframe>
<!-- Live2D 数字人服务 (live2d/web, 端口 3000) -->
<script>
// 拉取管理后台配置的音色，传给 Live2D 数字人
(async function(){
  try {
    const resp = await fetch('/api/public-config');
    const cfg = await resp.json();
    const iframe = document.getElementById('dhIframe');
    const sendCfg = function(){
      if(iframe && iframe.contentWindow){
        iframe.contentWindow.postMessage({type:'config',voice:'zh_male_tiancaitongsheng_mars_bigtts'},'*');
      }
    };
    iframe.addEventListener('load', sendCfg);
    if(iframe.contentWindow) sendCfg();
  } catch(e) { console.warn('加载数字人配置失败:', e); }
})();
</script>
</body></html>
