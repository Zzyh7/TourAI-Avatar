<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>景区导览AI数字人 — 数据后台</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0f1923;
      color: #e0e6ed;
      min-height: 100vh;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 32px;
      background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%);
      border-bottom: 1px solid #2a3a4a;
    }
    .header h1 { font-size: 24px; font-weight: 700; color: #4fc3f7; }
    .header .time { font-size: 14px; color: #78909c; }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 24px 32px;
    }
    .stat-card {
      background: linear-gradient(135deg, #1a2a3a 0%, #152535 100%);
      border: 1px solid #2a3a4a;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    .stat-card .label { font-size: 14px; color: #78909c; margin-bottom: 8px; }
    .stat-card .value { font-size: 36px; font-weight: 700; color: #4fc3f7; }
    .stat-card .sub { font-size: 12px; color: #546e7a; margin-top: 4px; }
    .charts-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      padding: 0 32px 24px;
    }
    .chart-box {
      background: linear-gradient(135deg, #1a2a3a 0%, #152535 100%);
      border: 1px solid #2a3a4a;
      border-radius: 12px;
      padding: 24px;
    }
    .chart-box h3 { font-size: 16px; font-weight: 600; color: #b0bec5; margin-bottom: 16px; }
    .chart-container { width: 100%; height: 400px; }
    .refresh-btn {
      background: #4fc3f7; color: #0d1b2a; border: none;
      padding: 8px 20px; border-radius: 6px; font-size: 14px;
      cursor: pointer; font-weight: 600;
    }
    .refresh-btn:hover { background: #29b6f6; }
    .loading { text-align: center; padding: 40px; color: #78909c; }
    .error { color: #ef5350; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 景区导览AI数字人 — 数据后台</h1>
    <div>
      <button class="refresh-btn" onclick="refreshAll()">🔄 刷新数据</button>
      <span class="time" style="margin-left:16px" id="currentTime"></span>
    </div>
  </div>

  <div class="dashboard" id="statsCards">
    <div class="stat-card">
      <div class="label">💬 服务人次</div>
      <div class="value" id="totalSessions">--</div>
      <div class="sub">总会话数</div>
    </div>
    <div class="stat-card">
      <div class="label">📝 对话总数</div>
      <div class="value" id="totalConvs">--</div>
      <div class="sub">用户消息 + AI回复</div>
    </div>
    <div class="stat-card">
      <div class="label">😊 满意度</div>
      <div class="value" id="sentimentRate" style="color:#66bb6a">--</div>
      <div class="sub">正面情感占比</div>
    </div>
    <div class="stat-card">
      <div class="label">⚡ 平均延迟</div>
      <div class="value" id="avgLatency" style="color:#ffa726">--</div>
      <div class="sub">毫秒</div>
    </div>
  </div>

  <div class="charts-row">
    <div class="chart-box">
      <h3>📈 情感趋势（近7天）</h3>
      <div class="chart-container" id="trendChart"></div>
    </div>
    <div class="chart-box">
      <h3>🍩 满意度分布（近7天）</h3>
      <div class="chart-container" id="pieChart"></div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/admin/stats';
    const trendChart = echarts.init(document.getElementById('trendChart'));
    const pieChart = echarts.init(document.getElementById('pieChart'));

    function updateTime() {
      document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
    }
    setInterval(updateTime, 1000);
    updateTime();

    async function fetchData(url) {
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return await resp.json();
      } catch (e) {
        console.error('Fetch error:', e);
        return null;
      }
    }

    async function refreshAll() {
      // Show loading state
      ['totalSessions','totalConvs','sentimentRate','avgLatency']
        .forEach(id => document.getElementById(id).textContent = '...');

      // Fetch overview
      const overview = await fetchData(`${API_BASE}/overview`);
      if (overview) {
        document.getElementById('totalSessions').textContent = overview.total_sessions || 0;
        document.getElementById('totalConvs').textContent = overview.total_conversations || 0;
        document.getElementById('sentimentRate').textContent = (overview.sentiment_rate || 0) + '%';
        document.getElementById('avgLatency').textContent = Math.round(overview.avg_latency_ms || 0) + 'ms';
      }

      // Fetch sentiment trend (7 days)
      const trend = await fetchData(`${API_BASE}/sentiment?days=7`);
      if (trend && trend.length > 0) {
        renderTrendChart(trend);
      } else {
        renderEmptyChart(trendChart, '暂无情感数据');
      }

      // Render pie from same trend data
      if (trend && trend.length > 0) {
        renderPieChart(trend);
      } else {
        renderEmptyChart(pieChart, '暂无数据');
      }

      // Resize charts
      trendChart.resize();
      pieChart.resize();
    }

    function renderTrendChart(data) {
      const dates = data.map(d => d.date);
      const positive = data.map(d => d['正面'] || 0);
      const neutral = data.map(d => d['中性'] || 0);
      const negative = data.map(d => d['负面'] || 0);

      trendChart.setOption({
        tooltip: {
          trigger: 'axis',
          backgroundColor: '#1a2a3a',
          borderColor: '#2a3a4a',
          textStyle: { color: '#e0e6ed' }
        },
        legend: {
          data: ['正面', '中性', '负面'],
          bottom: 0,
          textStyle: { color: '#78909c' }
        },
        grid: { left: '3%', right: '4%', bottom: '15%', top: '5%', containLabel: true },
        xAxis: {
          type: 'category',
          data: dates,
          axisLine: { lineStyle: { color: '#2a3a4a' } },
          axisLabel: { color: '#78909c' },
        },
        yAxis: {
          type: 'value',
          axisLine: { lineStyle: { color: '#2a3a4a' } },
          axisLabel: { color: '#78909c' },
          splitLine: { lineStyle: { color: '#1a2a3a' } },
        },
        series: [
          {
            name: '正面',
            type: 'line',
            data: positive,
            smooth: true,
            symbol: 'circle',
            symbolSize: 8,
            itemStyle: { color: '#66bb6a' },
            lineStyle: { width: 3 },
            areaStyle: { color: 'rgba(102,187,106,0.1)' },
          },
          {
            name: '中性',
            type: 'line',
            data: neutral,
            smooth: true,
            symbol: 'diamond',
            symbolSize: 8,
            itemStyle: { color: '#42a5f5' },
            lineStyle: { width: 2, type: 'dashed' },
            areaStyle: { color: 'rgba(66,165,245,0.05)' },
          },
          {
            name: '负面',
            type: 'line',
            data: negative,
            smooth: true,
            symbol: 'triangle',
            symbolSize: 8,
            itemStyle: { color: '#ef5350' },
            lineStyle: { width: 2, type: 'dotted' },
            areaStyle: { color: 'rgba(239,83,80,0.1)' },
          },
        ],
      }, true);
    }

    function renderPieChart(data) {
      // Aggregate sentiment totals from trend data
      let posTotal = 0, neuTotal = 0, negTotal = 0;
      data.forEach(d => {
        posTotal += d['正面'] || 0;
        neuTotal += d['中性'] || 0;
        negTotal += d['负面'] || 0;
      });

      const total = posTotal + neuTotal + negTotal || 1;
      const rate = ((posTotal / total) * 100).toFixed(1);

      pieChart.setOption({
        tooltip: {
          trigger: 'item',
          backgroundColor: '#1a2a3a',
          borderColor: '#2a3a4a',
          textStyle: { color: '#e0e6ed' },
          formatter: '{b}: {c} 条 ({d}%)'
        },
        legend: {
          bottom: 0,
          textStyle: { color: '#78909c' }
        },
        graphic: total > 0 ? [{
          type: 'text',
          left: 'center',
          top: '42%',
          style: {
            text: `满意度\n${rate}%`,
            textAlign: 'center',
            fill: '#66bb6a',
            fontSize: 18,
            fontWeight: 'bold',
          }
        }] : [],
        series: [{
          type: 'pie',
          radius: ['55%', '75%'],
          center: ['50%', '45%'],
          avoidLabelOverlap: false,
          itemStyle: { borderRadius: 6, borderColor: '#0f1923', borderWidth: 3 },
          label: { show: true, color: '#78909c', formatter: '{b}\n{d}%' },
          emphasis: {
            label: { fontSize: 16, fontWeight: 'bold' },
            scaleSize: 10,
          },
          data: [
            { value: posTotal, name: '😊 正面', itemStyle: { color: '#66bb6a' } },
            { value: neuTotal, name: '😐 中性', itemStyle: { color: '#42a5f5' } },
            { value: negTotal, name: '😟 负面', itemStyle: { color: '#ef5350' } },
          ],
        }],
      }, true);
    }

    function renderEmptyChart(chart, msg) {
      chart.setOption({
        title: { text: msg, left: 'center', top: 'center', textStyle: { color: '#546e7a', fontSize: 16 } },
        xAxis: { show: false },
        yAxis: { show: false },
        series: [],
      }, true);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      trendChart.resize();
      pieChart.resize();
    });

    // Initial load
    refreshAll();

    // Auto-refresh every 30 seconds
    setInterval(refreshAll, 30000);
  </script>
</body>
</html>
